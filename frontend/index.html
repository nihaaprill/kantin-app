<!DOCTYPE html>
<html>
<head><title>E-Film</title></head>
<body>
    <h1 id="film-name">Memuat...</h1>
    <ul id="film-list"></ul>

    <hr>
    <h3>Tambah Film Baru:</h3>
    <input type="text" id="film-input" placeholder="Nama film...">
    <button onclick="tambahFilm()">Tambah</button>

    <script>
        const API_URL = "/api"

        function loadData() {
            fetch(`${API_URL}/info`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('film-name').innerText = data.nama_film;
                    const list = document.getElementById('film-list');
                    list.innerHTML = '';
                    data.film.forEach(item => {
                        let li = document.createElement('li');
                        li.innerText = item;
                        list.appendChild(li);
                    });
                });
        }

        function tambahFilm() {
            const input = document.getElementById('film-input');
            fetch(`${API_URL}/add-film`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: input.value })
            })
            .then(res => res.json())
            .then(() => {
                input.value = '';
                loadData();
            });
        }

        loadData();
    </script>
</body>
</html>
